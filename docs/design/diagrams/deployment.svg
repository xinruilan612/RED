<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">云端部署拓扑</title><desc id="desc">D3 · 单节点起步，模型通过 API 调用，无需自备 GPU</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#71809c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="40" font-size="26" font-weight="700" fill="#182841">云端部署拓扑</text>
<text x="28" y="71" font-size="16" fill="#65748c">D3 · 单节点起步，模型通过 API 调用，无需自备 GPU</text>
<polyline points="600,188 600,270" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="229.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">公网 HTTPS</text>
<polyline points="410,309 185,309 185,430" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="297.5" y="300.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">页面</text>
<polyline points="600,348 600,430" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="389.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">/api</text>
<polyline points="790,469 850,469" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="460.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">任务通知</text>
<polyline points="1015,508 1015,550 600,550 600,610" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="807.5" y="541.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">领取任务</text>
<polyline points="790,649 850,649" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="640.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">调用</text>
<polyline points="410,469 375,469 375,740 185,740 185,800" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="383.0" y="604.5" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">业务事务</text>
<polyline points="410,649 185,649 185,800" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="297.5" y="640.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">检查点</text>
<polyline points="600,688 600,800" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="744.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">渲染任务</text>
<polyline points="790,839 850,839" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="830.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">上传</text>
<polyline points="185,878 185,970" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="193.0" y="924.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">每日 / 演练</text>
<rect x="410" y="110" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">用户浏览器</text>
<text x="600.0" y="167" text-anchor="middle" font-size="14" fill="#53627d">无需 CLI / API Key / 扩展</text>
<rect x="410" y="270" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="301" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">HTTPS 网关</text>
<text x="600.0" y="327" text-anchor="middle" font-size="14" fill="#53627d">TLS / 请求大小 / SSE 代理</text>
<rect x="20" y="430" width="330" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="185.0" y="461" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">Web 服务</text>
<text x="185.0" y="487" text-anchor="middle" font-size="14" fill="#53627d">Next.js</text>
<rect x="410" y="430" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="461" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">API 服务</text>
<text x="600.0" y="487" text-anchor="middle" font-size="14" fill="#53627d">FastAPI / Session / 归属校验</text>
<rect x="850" y="430" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="1015.0" y="461" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">Redis</text>
<text x="1015.0" y="487" text-anchor="middle" font-size="14" fill="#53627d">任务传输 / 限额协调</text>
<rect x="410" y="610" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="641" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">Worker + Dispatcher</text>
<text x="600.0" y="667" text-anchor="middle" font-size="14" fill="#53627d">Celery / LangGraph / outbox</text>
<rect x="850" y="610" width="330" height="78" rx="13" fill="#fff4e4" stroke="#bc791d" stroke-width="1.5"/>
<text x="1015.0" y="641" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">外部模型 API</text>
<text x="1015.0" y="667" text-anchor="middle" font-size="14" fill="#53627d">服务端密钥；有额度限制</text>
<rect x="20" y="800" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="185.0" y="831" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">PostgreSQL</text>
<text x="185.0" y="857" text-anchor="middle" font-size="14" fill="#53627d">持久卷或托管数据库</text>
<rect x="410" y="800" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="831" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">隔离的模板渲染器</text>
<text x="600.0" y="857" text-anchor="middle" font-size="14" fill="#53627d">禁止任意 HTML 和外网访问</text>
<rect x="850" y="800" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="1015.0" y="831" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">私有对象存储</text>
<text x="1015.0" y="857" text-anchor="middle" font-size="14" fill="#53627d">用户图片 / 图文导出</text>
<rect x="20" y="970" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="185.0" y="1001" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">备份与恢复</text>
<text x="185.0" y="1027" text-anchor="middle" font-size="14" fill="#53627d">RPO 24h / RTO 4h 待验证</text>
<text x="28" y="1110" font-size="15" fill="#65748c">初始资源建议：4 vCPU / 8 GiB；模型并发 2。均为待验证配置，不代表性能实测。</text>
<text x="28" y="1134" font-size="15" fill="#65748c">仅网关暴露公网；API/队列/数据库/Worker 走私网；对象下载使用短效授权链接。</text>
</g></svg>
