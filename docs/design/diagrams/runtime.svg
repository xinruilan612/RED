<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Runtime Console 事件链</title><desc id="desc">D5 · 真实事件驱动的观察与干预，不模拟 Agent 思考</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#71809c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="40" font-size="26" font-weight="700" fill="#182841">Runtime Console 事件链</text>
<text x="28" y="71" font-size="16" fill="#65748c">D5 · 真实事件驱动的观察与干预，不模拟 Agent 思考</text>
<polyline points="600,198 600,310" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="254.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">步骤、工具与记忆事件</text>
<polyline points="600,388 600,500" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="444.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">按用户与游标读取</text>
<polyline points="600,578 600,690" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="634.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">事件重放去重</text>
<polyline points="600,768 600,900" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="834.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">allowed_actions</text>
<polyline points="200,939 60,939 60,159 200,159" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="68.0" y="549.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">恢复命令</text>
<rect x="200" y="120" width="800" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="151" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">Orchestrator / Agents / Tools / Memory</text>
<text x="600.0" y="177" text-anchor="middle" font-size="14" fill="#53627d">统一 event_id / run_id / seq / agent / stage / snapshot_id</text>
<rect x="200" y="310" width="800" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="341" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">鉴权、脱敏与事件持久化</text>
<text x="600.0" y="367" text-anchor="middle" font-size="14" fill="#53627d">PostgreSQL 先落库，再通知；call_id 用量去重</text>
<rect x="200" y="500" width="800" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="531" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">API · SSE / 状态快照</text>
<text x="600.0" y="557" text-anchor="middle" font-size="14" fill="#53627d">15s 心跳 / Last-Event-ID 续读 / 5s 补偿轮询</text>
<rect x="200" y="690" width="800" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="721" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">UI · Runtime Console</text>
<text x="600.0" y="747" text-anchor="middle" font-size="14" fill="#53627d">状态 / 输入输出 / Tool calls / Memory reads / 耗时 / Token成本 / 错误重试</text>
<rect x="200" y="900" width="800" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="931" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">允许的用户操作 → 服务端校验</text>
<text x="600.0" y="957" text-anchor="middle" font-size="14" fill="#53627d">补料 / 改稿 / 接受 / 取消；幂等键 + 状态与稿件版本</text>
<text x="28" y="1070" font-size="15" fill="#65748c">默认摘要 240 字符，事件保留 30 天；过期游标返回快照并标记历史不完整。</text>
<text x="28" y="1094" font-size="15" fill="#65748c">成本 unknown 不记作 0；不展示密钥、完整系统提示或隐藏推理；管理员默认只能看脱敏指标。</text>
</g></svg>
