<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
<title id="title">创作与返修流程</title><desc id="desc">D2 · 用户控制选题和最终版本；系统执行有界协作</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#71809c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="40" font-size="26" font-weight="700" fill="#182841">创作与返修流程</text>
<text x="28" y="71" font-size="16" fill="#65748c">D2 · 用户控制选题和最终版本；系统执行有界协作</text>
<polyline points="600,188 600,260" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="224.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">提交</text>
<polyline points="600,338 600,410" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="374.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">资料充分</text>
<polyline points="410,299 185,299 185,410" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="297.5" y="290.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">资料不足</text>
<polyline points="600,488 600,560" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="524.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">确认</text>
<polyline points="600,638 600,710" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="674.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">候选稿</text>
<polyline points="600,788 600,860" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="824.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">稿件 + 排版</text>
<polyline points="600,938 600,1110" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="1024.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">通过</text>
<polyline points="410,899 185,899 185,488" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="193.0" y="693.5" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">缺少依据</text>
<polyline points="790,899 850,899" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="820.0" y="890.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">有问题</text>
<polyline points="1015,860 1015,599 790,599" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1023.0" y="729.5" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">文案返修</text>
<polyline points="850,920 820,920 820,749 790,749" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="828.0" y="834.5" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">排版返修</text>
<polyline points="1015,938 1015,1110" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1023.0" y="1024.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">上限</text>
<polyline points="600,1188 600,1320" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="1254.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">接受版本</text>
<polyline points="600,1398 600,1470" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="1434.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">成功</text>
<rect x="410" y="110" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">填写需求与真实素材</text>
<text x="600.0" y="167" text-anchor="middle" font-size="14" fill="#53627d">账号定位 / 本次主题 / 图片</text>
<rect x="410" y="260" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="291" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">策划 Agent · planner</text>
<text x="600.0" y="317" text-anchor="middle" font-size="14" fill="#53627d">3 个角度 + 素材缺口</text>
<rect x="410" y="410" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="441" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">用户选择选题</text>
<text x="600.0" y="467" text-anchor="middle" font-size="14" fill="#53627d">持久化暂停，不占 Worker</text>
<rect x="410" y="560" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="591" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">写作 Agent · writer</text>
<text x="600.0" y="617" text-anchor="middle" font-size="14" fill="#53627d">标题 / 正文 / 来源编号</text>
<rect x="410" y="710" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="741" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">编排 Agent · designer</text>
<text x="600.0" y="767" text-anchor="middle" font-size="14" fill="#53627d">模板 / 分页 / 配图</text>
<rect x="410" y="860" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="891" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">审稿 Agent · reviewer</text>
<text x="600.0" y="917" text-anchor="middle" font-size="14" fill="#53627d">内容依据 / 标题兑现 / 版式</text>
<rect x="20" y="410" width="330" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="185.0" y="441" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">补充真实资料</text>
<text x="185.0" y="467" text-anchor="middle" font-size="14" fill="#53627d">更新快照后恢复请求节点</text>
<rect x="850" y="860" width="330" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="1015.0" y="891" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">返修路由</text>
<text x="1015.0" y="917" text-anchor="middle" font-size="14" fill="#53627d">文案 → writer；排版 → designer</text>
<rect x="850" y="1110" width="330" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="1015.0" y="1141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">达到 2 轮自动返修上限</text>
<text x="1015.0" y="1167" text-anchor="middle" font-size="14" fill="#53627d">暂停，请用户处理问题</text>
<rect x="410" y="1110" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="1141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">用户编辑与定稿</text>
<text x="600.0" y="1167" text-anchor="middle" font-size="14" fill="#53627d">候选稿和差异，明确接受</text>
<rect x="410" y="1320" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="1351" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">模板渲染与导出</text>
<text x="600.0" y="1377" text-anchor="middle" font-size="14" fill="#53627d">有效审核版本 + 图文预览</text>
<rect x="410" y="1470" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="1501" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">获得可发布素材</text>
<text x="600.0" y="1527" text-anchor="middle" font-size="14" fill="#53627d">用户手动发布；不预测爆款</text>
<text x="28" y="1610" font-size="15" fill="#65748c">补料、返修上限和用户要求改稿：按服务端保存的 resume_node 恢复，见 FLOWS.md。</text>
<text x="28" y="1634" font-size="15" fill="#65748c">导出失败只重试渲染；用户修改稿件后旧排版与审核失效，需重新检查。</text>
</g></svg>
