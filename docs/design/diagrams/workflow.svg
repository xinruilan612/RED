<text x="608.0" y="1179.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">接受且版本有效</text>
<polyline points="600,1298 600,1380" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="1339.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">有效审核版本</text>
<polyline points="600,1458 600,1540" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="1499.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">文件齐全</text>
<rect x="410" y="110" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">用户 Brief + 输入快照</text>
<text x="600.0" y="167" text-anchor="middle" font-size="14" fill="#53627d">固定 Profile / Material / History</text>
<rect x="20" y="270" width="360" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="200.0" y="301" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">① Audience · 受众洞察</text>
<text x="200.0" y="327" text-anchor="middle" font-size="14" fill="#53627d">历史分析 / 相似内容 / 画像与历史</text>
<rect x="820" y="270" width="360" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="1000.0" y="301" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">② Research · 素材研究</text>
<text x="1000.0" y="327" text-anchor="middle" font-size="14" fill="#53627d">素材检索 / 依据检查 / 证据缺口</text>
<rect x="410" y="440" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="471" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">Join · 同快照汇合</text>
<text x="600.0" y="497" text-anchor="middle" font-size="14" fill="#53627d">两分支有效成功；失败不当空结果</text>
<rect x="410" y="600" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="631" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">③ Content · 内容策划创作</text>
<text x="600.0" y="657" text-anchor="middle" font-size="14" fill="#53627d">Strategy → Outline → Hook → Title → Body</text>
<rect x="410" y="780" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="811" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">④ Reviewer · 主编审核</text>
<text x="600.0" y="837" text-anchor="middle" font-size="14" fill="#53627d">八项检查 / 阻断问题 / 修改指令</text>
<rect x="850" y="600" width="330" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="1015.0" y="631" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">Content.revise</text>
<text x="1015.0" y="657" text-anchor="middle" font-size="14" fill="#53627d">修改受影响字段 / 完整稿复审</text>
<rect x="20" y="1060" width="330" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="185.0" y="1091" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">补充资料 / 新快照</text>
<text x="185.0" y="1117" text-anchor="middle" font-size="14" fill="#53627d">重新验证两分支；预算不静默清零</text>
<rect x="850" y="960" width="330" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="1015.0" y="991" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">自动返修上限</text>
<text x="1015.0" y="1017" text-anchor="middle" font-size="14" fill="#53627d">等待补料新运行或取消</text>
<rect x="410" y="1060" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="1091" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">人工确认当前已审版本</text>
<text x="600.0" y="1117" text-anchor="middle" font-size="14" fill="#53627d">接受 / 请求改稿 / 取消</text>
<rect x="410" y="1220" width="380" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="1251" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">最终内容版本</text>
<text x="600.0" y="1277" text-anchor="middle" font-size="14" fill="#53627d">用户接受后进入 History</text>
<rect x="410" y="1380" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="1411" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">模板工具导出</text>
<text x="600.0" y="1437" text-anchor="middle" font-size="14" fill="#53627d">确认版本 / 图片 / manifest</text>
<rect x="410" y="1540" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="1571" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">完成交付</text>
<text x="600.0" y="1597" text-anchor="middle" font-size="14" fill="#53627d">发布由人决定，指标手工回填</text>
<rect x="850" y="1540" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="1015.0" y="1571" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">取消 / 保留候选稿</text>
<text x="1015.0" y="1597" text-anchor="middle" font-size="14" fill="#53627d">不升级为最终内容</text>
<text x="28" y="1750" font-size="15" fill="#65748c">没有历史只能标注假设；补料入口也用于汇合前发现关键资料不足，见 FLOWS.md。</text>
<text x="28" y="1774" font-size="15" fill="#65748c">改稿后必回 Reviewer；修改过的稿件必须复审。图中的业务恢复不重置旧 run 累计费用。</text>
</g></svg>
