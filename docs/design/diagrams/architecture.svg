<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">软件总体架构</title><desc id="desc">D1 · 模块化服务 + 持久化的四 Agent 工作流</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#71809c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="40" font-size="26" font-weight="700" fill="#182841">软件总体架构</text>
<text x="28" y="71" font-size="16" fill="#65748c">D1 · 模块化服务 + 持久化的四 Agent 工作流</text>
<polyline points="600,188 600,270" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="229.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">HTTPS / SSE</text>
<polyline points="410,309 190,309 190,430" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.0" y="300.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">素材与版本</text>
<polyline points="600,348 600,430" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="389.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">异步任务</text>
<polyline points="600,508 600,590" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="549.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">领取与续跑</text>
<polyline points="790,629 860,629" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="825.0" y="620.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">服务端调用</text>
<polyline points="600,668 600,750" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="709.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">确认版本</text>
<polyline points="190,508 190,910" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="198.0" y="709.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">业务持久化</text>
<polyline points="410,629 375,629 375,869 190,869 190,910" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="383.0" y="749.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">检查点与状态</text>
<polyline points="600,828 600,910" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="869.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">图片与清单</text>
<polyline points="1020,668 1020,910" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1028.0" y="789.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">用量与错误</text>
<rect x="410" y="110" width="380" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="600.0" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M01 网页工作台</text>
<text x="600.0" y="167" text-anchor="middle" font-size="14" fill="#53627d">定位 / 素材 / 编辑 / 预览 / 导出</text>
<rect x="410" y="270" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="301" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M02 业务 API</text>
<text x="600.0" y="327" text-anchor="middle" font-size="14" fill="#53627d">认证、权限、幂等、版本校验</text>
<rect x="20" y="430" width="340" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="190.0" y="461" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M03 + M07 内容与版本</text>
<text x="190.0" y="487" text-anchor="middle" font-size="14" fill="#53627d">素材快照 / 用户稿 / 候选稿</text>
<rect x="410" y="430" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="461" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M04 调度与任务队列</text>
<text x="600.0" y="487" text-anchor="middle" font-size="14" fill="#53627d">outbox → Redis / Celery</text>
<rect x="410" y="590" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="621" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M05 四 Agent 工作流</text>
<text x="600.0" y="647" text-anchor="middle" font-size="14" fill="#53627d">策划 → 写作 → 编排 → 审稿</text>
<rect x="860" y="590" width="320" height="78" rx="13" fill="#fff4e4" stroke="#bc791d" stroke-width="1.5"/>
<text x="1020.0" y="621" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M06 模型网关</text>
<text x="1020.0" y="647" text-anchor="middle" font-size="14" fill="#53627d">额度预留 / API / 计量</text>
<rect x="410" y="750" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="781" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M08 模板渲染与导出</text>
<text x="600.0" y="807" text-anchor="middle" font-size="14" fill="#53627d">固定模板 / PNG / ZIP</text>
<rect x="20" y="910" width="340" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="190.0" y="941" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M09 PostgreSQL</text>
<text x="190.0" y="967" text-anchor="middle" font-size="14" fill="#53627d">项目 / 任务 / 检查点 / 事件</text>
<rect x="410" y="910" width="380" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="941" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M09 私有对象存储</text>
<text x="600.0" y="967" text-anchor="middle" font-size="14" fill="#53627d">原始图片 / 导出文件</text>
<rect x="860" y="910" width="320" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="1020.0" y="941" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">M09 运行观测</text>
<text x="1020.0" y="967" text-anchor="middle" font-size="14" fill="#53627d">脱敏日志 / 指标 / 用量</text>
<text x="28" y="1070" font-size="15" fill="#65748c">私有网络：API、Worker、数据库及队列均在服务端；仅 HTTPS 网关对外。</text>
<text x="28" y="1094" font-size="15" fill="#65748c">状态事件由 API 鉴权后提供给网页；模型密钥不下发。编号对应模块设计。</text>
</g></svg>
