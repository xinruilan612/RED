<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
<title id="title">任务生命周期</title><desc id="desc">D4 · 终态不回退，恢复保留累计用量及重试计数</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#71809c"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="40" font-size="26" font-weight="700" fill="#182841">任务生命周期</text>
<text x="28" y="71" font-size="16" fill="#65748c">D4 · 终态不回退，恢复保留累计用量及重试计数</text>
<polyline points="600,188 600,300" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="244.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">领取</text>
<polyline points="410,339 185,339 185,510" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="297.5" y="330.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">需确认 / 补料</text>
<polyline points="20,549 10,549 10,149 410,149" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="18.0" y="349.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">用户恢复</text>
<polyline points="790,339 1015,339 1015,510" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="902.5" y="330.0" font-size="14" text-anchor="middle" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">短暂故障</text>
<polyline points="1180,549 1190,549 1190,149 790,149" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1182.0" y="349.0" font-size="14" text-anchor="end" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">重试</text>
<polyline points="600,378 600,690" fill="none" stroke="#71809c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="608.0" y="534.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">目标达成</text>
<polyline points="450,378 390,378 390,825 600,825 600,880" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="398.0" y="601.5" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">取消请求</text>
<polyline points="185,588 185,880" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="193.0" y="734.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">超期</text>
<polyline points="1015,588 1015,880" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1023.0" y="734.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">不可继续</text>
<polyline points="790,360 815,360 815,850 1015,850 1015,880" fill="none" stroke="#71809c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="823.0" y="605.0" font-size="14" text-anchor="start" fill="#53627d" stroke="white" stroke-width="5" paint-order="stroke">不可恢复</text>
<rect x="410" y="110" width="380" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="600.0" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">QUEUED · 等待执行</text>
<text x="600.0" y="167" text-anchor="middle" font-size="14" fill="#53627d">任务和 outbox 已落库</text>
<rect x="410" y="300" width="380" height="78" rx="13" fill="#eeebff" stroke="#7354bd" stroke-width="1.5"/>
<text x="600.0" y="331" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">RUNNING · 正在执行</text>
<text x="600.0" y="357" text-anchor="middle" font-size="14" fill="#53627d">租约 120s / 心跳 20s</text>
<rect x="20" y="510" width="330" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>
<text x="185.0" y="541" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">WAITING_USER · 等待用户</text>
<text x="185.0" y="567" text-anchor="middle" font-size="14" fill="#53627d">保存检查点，释放 Worker</text>
<rect x="850" y="510" width="330" height="78" rx="13" fill="#f0f5ff" stroke="#4763b6" stroke-width="1.5"/>
<text x="1015.0" y="541" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">RETRY_WAIT · 等待重试</text>
<text x="1015.0" y="567" text-anchor="middle" font-size="14" fill="#53627d">短暂故障，有界退避</text>
<rect x="410" y="690" width="380" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="721" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">SUCCEEDED · 目标完成</text>
<text x="600.0" y="747" text-anchor="middle" font-size="14" fill="#53627d">成果可查询</text>
<rect x="20" y="880" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="185.0" y="911" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">EXPIRED · 等待过期</text>
<text x="185.0" y="937" text-anchor="middle" font-size="14" fill="#53627d">7 天后关闭，保留草稿</text>
<rect x="410" y="880" width="380" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="911" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">CANCELLED · 已取消</text>
<text x="600.0" y="937" text-anchor="middle" font-size="14" fill="#53627d">不接受迟到成果</text>
<rect x="850" y="880" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="1015.0" y="911" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">FAILED · 执行失败</text>
<text x="1015.0" y="937" text-anchor="middle" font-size="14" fill="#53627d">配置 / 超时 / 不可恢复错误</text>
<text x="28" y="1100" font-size="15" fill="#65748c">所有非终态均可 CANCELLED；RUNNING 也可直接 FAILED。完整转换表见 design_contract.json。</text>
<text x="28" y="1124" font-size="15" fill="#65748c">SUCCEEDED 代表本次请求目标达成；full 流程需用户接受。导出任务有独立状态。</text>
</g></svg>
