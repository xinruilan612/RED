<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#71809c"/></marker></defs>

<text x="600.0" y="331" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">RUNNING · 正在执行</text>
<text x="600.0" y="357" text-anchor="middle" font-size="14" fill="#53627d">租约 120s / 心跳 20s</text>
<rect x="20" y="510" width="330" height="78" rx="13" fill="#eaf8f3" stroke="#15816a" stroke-width="1.5"/>

<text x="1015.0" y="541" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">RETRY_WAIT · 等待重试</text>
<text x="1015.0" y="567" text-anchor="middle" font-size="14" fill="#53627d">短暂故障，有界退避</text>
<rect x="410" y="690" width="380" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="721" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">SUCCEEDED · 目标完成</text>
<text x="600.0" y="747" text-anchor="middle" font-size="14" fill="#53627d">成果可查询</text>
<rect x="20" y="880" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="185.0" y="911" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">EXPIRED · 等待过期</text>
<text x="185.0" y="937" text-anchor="middle" font-size="14" fill="#53627d">7 天后关闭，保留草稿</text>
<rect x="410" y="880" width="380" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="600.0" y="911" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">CANCELLED · 已取消</text>
<text x="600.0" y="937" text-anchor="middle" font-size="14" fill="#53627d">不接受迟到成果</text>
<rect x="850" y="880" width="330" height="78" rx="13" fill="#f4f6f9" stroke="#65748c" stroke-width="1.5"/>
<text x="1015.0" y="911" text-anchor="middle" font-size="19" font-weight="600" fill="#182841">FAILED · 执行失败</text>
<text x="1015.0" y="937" text-anchor="middle" font-size="14" fill="#53627d">配置 / 超时 / 不可恢复错误</text>
<text x="28" y="1100" font-size="15" fill="#65748c">所有非终态均可 CANCELLED；RUNNING 也可直接 FAILED。完整转换表见 design_contract.json。</text>
<text x="28" y="1124" font-size="15" fill="#65748c">SUCCEEDED 代表本次请求目标达成；full 流程需用户接受。导出任务有独立状态。</text>
</g></svg>
