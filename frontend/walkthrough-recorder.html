<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有迹 · 真实操作录屏</title><link rel="stylesheet" href="/walkthrough-recorder.css"><script src="/walkthrough-recorder.js" defer></script></head>
<body>
<header class="toolbar">
  <div class="identity"><strong>有迹 · 操作录屏</strong><span id="recordingTimer" aria-label="录制时长">00:00</span></div>
  <div class="actions"><button id="startRecording" type="button">开始录屏</button><button id="stopRecording" type="button" disabled>停止并生成视频</button><a id="downloadRecording" hidden>下载录屏（WebM）</a></div>
  <p id="recordingStatus" role="status">点击开始后，在浏览器弹窗中选择当前“有迹 · 真实操作录屏”标签页。只录画面，不录声音，不上传。</p>
</header>
<details class="guide"><summary>录制步骤与说明</summary><p>先选择当前标签页并共享 → 在下方真实网站保存资料、生成和修改稿件、确认、下载成品 → 点击“停止并生成视频” → 下载录屏。建议约 5 分钟；真实生成等待也会被录下。</p><p>视频格式为 WebM，可用 Chrome 播放；比赛提交需要 MP4 时另行转码。刷新或关闭本页会丢失尚未下载的录制。不要在录制中输入密码、密钥或打开私人资料。此页不自动发布内容。</p></details>
<iframe title="有迹真实网站操作区" src="/#library"></iframe>
</body></html>
