name: Cross-platform acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.label }} / Python 3.12 / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows x64
            architecture: x64
            pg_major: '17'
          - os: macos-15
            label: macOS 15 ARM64
            architecture: arm64
            pg_major: '17'
          - os: macos-15-intel
            label: macOS 15 Intel
            architecture: x64
            pg_major: '17'
          - os: ubuntu-24.04
            label: Ubuntu 24.04 x64
            architecture: x64
            pg_major: '16'
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      RED_CI_PG_MAJOR: ${{ matrix.pg_major }}
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          architecture: ${{ matrix.architecture }}
      - name: Install the existing pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      # The official macOS 15 image manifests do not list PostgreSQL.
      # Install binaries only; never start Homebrew's default database/service.
      - name: Install PostgreSQL 17 binaries on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install postgresql@17
          echo "RED_CI_PG_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - name: Full Python + PostgreSQL, Node behavior, JS syntax, UTF-8 and native launcher gates
        run: python scripts/ci_postgres.py
