name: Cross-platform verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js
      - run: node --check frontend/operations.js
      - run: node --check frontend/account.js
      - run: node --check frontend/auth.js
      - run: node --check frontend/knowledge.js
      - run: node --check frontend/promotion.js
      - run: node --test
      - run: python scripts/start_demo.py --smoke

  postgresql:
    name: PostgreSQL integration / Ubuntu
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: youji_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: youji_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U youji_test -d youji_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://youji_test:test-only-password@127.0.0.1:5432/youji_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
